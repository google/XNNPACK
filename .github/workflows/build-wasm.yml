name: Build WebAssembly

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cmake-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: emscripten/emsdk:6.0.6@sha256:be96eff5810e42c632f3f8b795388a6b596e4fb21ec28b9e1fb1bc49bb3b1eef
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Configure and build
        run: bash scripts/build-wasm.sh
